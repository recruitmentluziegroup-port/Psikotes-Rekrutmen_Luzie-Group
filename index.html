  lead: "Formulir ini terdiri dari dua bagian, dengan total perkiraan waktu pengerjaan ±15 menit:",
  parts: [
    "Bagian 1: 12 kelompok pernyataan — pilih pernyataan yang paling dan yang paling tidak menggambarkan diri Anda.",
    "Bagian 2: 50 pasang pernyataan — pilih satu pernyataan yang paling menggambarkan diri Anda."
  ],
  rulesHead: "Petunjuk penting:",
  rules: [
    "Tidak ada jawaban yang benar atau salah. Jawablah dengan jujur sesuai keadaan Anda yang sebenarnya.",
    "Jawablah secara spontan — jawaban pertama yang terlintas biasanya yang paling tepat. Usahakan tidak lebih dari ±30 detik per nomor.",
    "Kerjakan sendiri, tanpa bantuan orang lain atau sumber lain.",
    "Batas waktu pengiriman jawaban mengikuti keterangan pada email undangan yang Anda terima."
  ],
  foot: "Isi identitas di bawah ini terlebih dahulu, lalu kerjakan Bagian 1 dan Bagian 2 sampai selesai."
};

const seq = [{t:'identity'}];
[1,2].forEach(n => {
  const sec = CONFIG['bagian'+n];
  if (sec.items.length) {
    seq.push({t:'intro', n});
    sec.items.forEach((it,i)=> seq.push({t:'q', n, i}));
  }
});
seq.push({t:'submit'});

const S = { pos:0, id:{nama:'',email:'',hp:'',posisi:'',lainnya:''}, a1:{}, a2:{}, timer:null, left:0, total:0 };

function configIssues(){
  const out=[];
  Object.entries(CONFIG.entries).forEach(([k,v])=>{ if(/X{3,}/.test(v)) out.push('ID kolom identitas "'+k+'" belum diisi'); });
  if(!CONFIG.bagian1.items.length) out.push('Soal Bagian 1 belum diisi');
  if(!CONFIG.bagian2.items.length) out.push('Soal Bagian 2 belum diisi');
  const x = v => !v || /X{3,}/.test(v);
  const m1 = CONFIG.bagian1.items.filter(it => x(it.entryMost) || x(it.entryLeast)).length;
  const m2 = CONFIG.bagian2.items.filter(it => x(it.entry)).length;
  if(m1) out.push('ID kolom Bagian 1 belum diisi ('+m1+' kelompok)');
  if(m2) out.push('ID kolom Bagian 2 belum diisi ('+m2+' pasangan)');
  return out;
}

function secSeconds(step){
  const sec = CONFIG['bagian'+step.n];
  const it = sec.items[step.i];
  return it.seconds || CONFIG.sectionSeconds[step.n] || CONFIG.defaultSeconds;
}

function stopTimer(){ if(S.timer){ clearInterval(S.timer); S.timer=null; } }

function render(){
  stopTimer();
  const st = seq[S.pos];
  if(st.t==='identity') return renderIdentity();
  if(st.t==='intro') return renderSectionIntro(st);
  if(st.t==='q') return renderQuestion(st);
  if(st.t==='submit') return submitAll();
}

function renderIdentity(){
  const issues = configIssues();
  const opts = CONFIG.posisiOptions.map(o=>`<option ${S.id.posisi===o?'selected':''}>${esc(o)}</option>`).join('')
             + `<option ${S.id.posisi==='Lainnya'?'selected':''}>Lainnya</option>`;
  $app.innerHTML = `
  ${issues.length?`<div class="warn"><b>Pengaturan belum lengkap.</b> Buka file HTML ini dan lengkapi bagian PENGATURAN:<ul style="margin:8px 0 0;padding-left:18px">${issues.slice(0,6).map(i=>`<li>${esc(i)}</li>`).join('')}${issues.length>6?`<li>dan ${issues.length-6} lainnya</li>`:''}</ul></div>`:''}
  <section class="card intro">
    <p><b>${esc(intro.head)}</b></p>
    <p>${esc(intro.lead)}</p>
    <ul>${intro.parts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
    <p>${esc(intro.rulesHead)}</p>
    <ul>${intro.rules.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
    <div class="note">${esc(intro.foot)}</div>
    <div style="font-size:13px;color:var(--muted)"><span class="req">*</span> Menunjukkan pertanyaan yang wajib diisi</div>
  </section>
  <section class="card">
    <div class="steps"><span class="on"></span><span></span><span></span></div>
    <h2>Identitas Kandidat</h2>
    <p class="sub">Isi dengan data Anda yang sebenarnya.</p>
    <div class="field" id="f-nama"><label class="f">Nama Lengkap <span class="req">*</span></label>
      <input type="text" id="nama" autocomplete="name" placeholder="Jawaban Anda" value="${esc(S.id.nama)}"><div class="err">Ini adalah pertanyaan wajib</div></div>
    <div class="field" id="f-email"><label class="f">Alamat Email <span class="req">*</span></label>
      <input type="email" id="email" autocomplete="email" placeholder="Jawaban Anda" value="${esc(S.id.email)}"><div class="err">Masukkan alamat email yang valid</div></div>
    <div class="field" id="f-hp"><label class="f">Nomor HP / WhatsApp <span class="req">*</span></label>
      <input type="tel" id="hp" autocomplete="tel" placeholder="Jawaban Anda" value="${esc(S.id.hp)}"><div class="err">Masukkan nomor HP yang valid</div></div>
    <div class="field" id="f-posisi"><label class="f">Posisi yang Dilamar <span class="req">*</span></label>
      <select id="posisi"><option value="">Pilih</option>${opts}</select>
      <input type="text" id="lainnya" placeholder="Tuliskan posisi lainnya" style="margin-top:8px;display:${S.id.posisi==='Lainnya'?'block':'none'}" value="${esc(S.id.lainnya)}">
      <div class="err">Ini adalah pertanyaan wajib</div></div>
    <div class="row"><span style="font-size:13px;color:var(--muted)">Halaman 1 dari ${seq.filter(s=>s.t==='intro').length+1}</span>
      <button class="btn" id="next" ${issues.length?'disabled':''}>Berikutnya</button></div>
  </section>`;
  const sel = document.getElementById('posisi');
  sel.onchange = () => { document.getElementById('lainnya').style.display = sel.value==='Lainnya'?'block':'none'; };
  document.getElementById('next').onclick = () => {
    const v = {nama:nama.value.trim(), email:email.value.trim(), hp:hp.value.trim(), posisi:sel.value, lainnya:lainnya.value.trim()};
    const bad = {
      nama: !v.nama,
      email: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email),
      hp: v.hp.replace(/\D/g,'').length < 9,
      posisi: !v.posisi || (v.posisi==='Lainnya' && !v.lainnya)
    };
    Object.keys(bad).forEach(k=>document.getElementById('f-'+k).classList.toggle('bad',bad[k]));
    if(Object.values(bad).some(Boolean)){ document.querySelector('.field.bad')?.scrollIntoView({behavior:'smooth',block:'center'}); return; }
    S.id = v; S.pos++; window.scrollTo({top:0}); render();
  };
}

function renderSectionIntro(st){
  const sec = CONFIG['bagian'+st.n];
  const first = sec.items[0];
  const secs = CONFIG.sectionSeconds[st.n] || CONFIG.defaultSeconds;
  $app.innerHTML = `<section class="card">
    <div class="steps"><span class="on"></span><span class="${st.n>=1?'on':''}"></span><span class="${st.n>=2?'on':''}"></span></div>
    <h2>${esc(sec.title)}</h2>
    <p class="sub">${esc(sec.instruction)}</p>
    <div class="note">Setiap soal memiliki batas waktu sekitar <b>${secs} detik</b>. Saat waktu habis, soal akan lanjut otomatis${CONFIG.allowBack?'':' dan tidak dapat dibuka kembali'}. Timer dimulai setelah Anda menekan tombol di bawah.</div>
    <div class="row"><span></span><button class="btn" id="go">Mulai ${esc(sec.title)}</button></div>
  </section>`;
  document.getElementById('go').onclick = () => { S.pos++; window.scrollTo({top:0}); render(); };
}

function renderQuestion(st){
  const sec = CONFIG['bagian'+st.n];
  const it = sec.items[st.i];
  const total = sec.items.length;
  const secs = secSeconds(st);
  const store = st.n===1 ? S.a1 : S.a2;
  const cur = store[st.i] || (st.n===1 ? {most:null,least:null} : {pick:null});
  store[st.i] = cur;
  const lastQ = !seq[S.pos+1] || seq[S.pos+1].t!=='q' || seq[S.pos+1].n!==st.n;

  let body = '';
  if(st.n===1){
    body = `<p class="hint">Pilih 1 pernyataan yang <b>PALING</b> menggambarkan diri Anda, dan 1 pernyataan yang <b>PALING TIDAK</b> menggambarkan diri Anda.</p>` +
      it.statements.map((t,k)=>`<div class="grp"><div class="txt">${esc(t)}</div>
        <div class="pick"><button class="m ${cur.most===k?'on':''}" data-k="${k}" data-r="most">Paling</button>
        <button class="l ${cur.least===k?'on':''}" data-k="${k}" data-r="least">Paling tidak</button></div></div>`).join('');
  } else {
    body = `<p class="hint">Pilih satu pernyataan yang paling menggambarkan diri Anda.</p>` +
      it.statements.map((t,k)=>`<div class="opt ${cur.pick===k?'sel':''}" data-k="${k}"><span class="dot"></span><span class="txt">${esc(t)}</span></div>`).join('');
  }

  $app.innerHTML = `<section class="card">
    <div class="tbar"><span class="tag">${esc(sec.title)}</span>
      <span class="chip" id="chip"><span id="sisa">${secs}</span> detik</span></div>
    <div class="pbar" id="pbar"><div id="fill"></div></div>
    <div class="qno">${esc(sec.unit)} ${st.i+1} dari ${total}</div>
    ${body}
    <div class="row">
      ${CONFIG.allowBack && S.pos>1 ? '<button class="btn ghost" id="prev">Kembali</button>' : '<span></span>'}
      <button class="btn" id="nx">${lastQ && seq[S.pos+1]?.t==='submit' ? 'Kirim' : 'Lanjut'}</button>
    </div>
    <div class="err" id="qerr" style="display:none;margin-top:10px;text-align:right">Lengkapi jawaban sebelum lanjut.</div>
  </section>`;

  if(st.n===1){
    $app.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, r=b.dataset.r, o = r==='most'?'least':'most';
      cur[r]=k; if(cur[o]===k) cur[o]=null;
      $app.querySelectorAll('.pick button').forEach(x=>{
        const kk=+x.dataset.k, rr=x.dataset.r; x.classList.toggle('on', cur[rr]===kk);
      });
    });
  } else {
    $app.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
      cur.pick=+o.dataset.k; $app.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',+x.dataset.k===cur.pick));
    });
  }

  const advance = () => { stopTimer(); S.pos++; window.scrollTo({top:0}); render(); };
  document.getElementById('nx').onclick = () => {
    const ok = st.n===1 ? (cur.most!==null && cur.least!==null) : cur.pick!==null;
    if(!ok){ document.getElementById('qerr').style.display='block'; return; }
    advance();
  };
  const pv = document.getElementById('prev');
  if(pv) pv.onclick = () => { stopTimer(); S.pos--; render(); };

  // ---- timer ----
  S.total = secs;
  const deadline = Date.now() + secs*1000;
  const tick = () => {
    const ms = Math.max(0, deadline - Date.now());
    const left = Math.ceil(ms/1000);
    const sisa = document.getElementById('sisa'); if(!sisa) return;
    sisa.textContent = left;
    document.getElementById('fill').style.width = (ms/(secs*1000)*100)+'%';
    const low = left <= 10;
    document.getElementById('chip').classList.toggle('low',low);
    document.getElementById('pbar').classList.toggle('low',low);
    if(ms<=0){
      stopTimer();
      if(CONFIG.autoNextOnTimeout) advance();
      else { document.getElementById('qerr').textContent='Waktu habis.'; document.getElementById('qerr').style.display='block'; }
    }
  };
  tick();
  S.timer = setInterval(tick, 200);
}

async function submitAll(){
  $app.innerHTML = `<section class="card done"><div class="spin"></div><h2>Mengirim jawaban…</h2><p class="sub">Jangan tutup halaman ini.</p></section>`;
  const E = CONFIG.entries, body = new URLSearchParams();
  body.append(E.nama, S.id.nama);
  body.append(E.email, S.id.email);
  body.append(E.hp, S.id.hp);
  if(S.id.posisi==='Lainnya'){ body.append(E.posisi,'__other_option__'); body.append(E.posisi+'.other_option_response', S.id.lainnya); }
  else body.append(E.posisi, S.id.posisi);

  CONFIG.bagian1.items.forEach((it,i)=>{
    const a = S.a1[i] || {};
    body.append(it.entryMost,  a.most  != null ? it.statements[a.most]  : '');
    body.append(it.entryLeast, a.least != null ? it.statements[a.least] : '');
  });
  CONFIG.bagian2.items.forEach((it,i)=>{
    const a = S.a2[i] || {};
    body.append(it.entry, a.pick != null ? it.statements[a.pick] : '');
  });
  body.append('fvv','1');
  body.append('pageHistory', CONFIG.pageHistory);

  const url = `https://docs.google.com/forms/d/e/${CONFIG.formId}/formResponse`;
  try{
    await fetch(url,{method:'POST',mode:'no-cors',body});
    $app.innerHTML = `<section class="card done"><div class="ic">✓</div><h2>Jawaban Anda telah terkirim</h2>
      <p class="sub" style="margin:0">Terima kasih telah mengikuti psikotes rekrutmen Luzie Group. Tim kami akan menghubungi Anda sesuai informasi pada email undangan.</p></section>`;
  }catch(e){
    $app.innerHTML = `<section class="card done"><h2>Pengiriman gagal</h2>
      <p class="sub">Periksa koneksi internet Anda, lalu coba kirim lagi.</p>
      <button class="btn" id="retry">Kirim ulang</button></section>`;
    document.getElementById('retry').onclick = submitAll;
  }
}

render();
</script>
</body>
</html>
